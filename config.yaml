# Your Webhallen level: alerts say whether you can already buy or need to wait for the level to drop.
my_level: 9

# No checks (and no "monitor was delayed" alerts) during these hours.
quiet_hours:
  start: "02:00"
  end: "06:00"
  timezone: Europe/Stockholm

webhallen:
  # Pokémon products released on/after this date are tracked (Prismatic Evolutions era onwards).
  since: "2025-01-01"
  queries:
    - pokemon elite trainer box
    - pokemon booster bundle
    - pokemon 30th celebration
    - pokemon collection
    - pokemon ultra premium
  # max_price: 1500   # SEK, optional

# Shopify shops: stock comes from /collections/<handle>/products.json. Only these collections are scanned.
shop_since: "2025-01-01"
shops:
  - name: Alara Games
    base: https://www.alaragames.se
    collections: [filter-all-pokemon]
  - name: Manatorsk
    base: https://manatorsk.com
    collections: [pokemon-elite-trainer-boxes, pokemon-collection-boxes, pokemon-booster-boxes]
  - name: Speltrollet
    base: https://speltrollet.se
    collections: [pokemon, pokemon-boxar, pokemon-displayer]
  - name: Dragon's Lair
    base: https://dragonslair.se
    collections: [pokemon-booster-pack, engelska-displayer]

# Specific cards/products to watch by name (Shopify predictive search, includes sold-out listings).
watchlist:
  - name: Muxus, Goblin Grandee
    match: "muxus, goblin grandee"
    notify_new_listing: true   # also push when a new printing is listed (even if not in stock yet)
    shops:
      - name: Alara Games
        base: https://www.alaragames.se
      - name: Manatorsk
        base: https://manatorsk.com

# Static product pages for other shops (JSON-LD availability). Add real URLs here.
products:
  # - name: "Some shop – <set> ETB"
  #   retailer: jsonld
  #   url: "https://example.com/product/123"
  #   max_price: 600
  []
